name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt
      - name: Audit production dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --cache-dir .audit-cache --timeout 60 -r requirements.txt --format json --output production-audit.json
      - name: Validate package metadata and PyInstaller configuration
        run: |
          python tools/windows_build_check.py
          python -m PyInstaller --version
          python -c "from pathlib import Path; assert Path('research_analysis.spec').is_file(); assert Path('assets/research_analysis.ico').is_file(); assert Path('runtime_hooks/windows_runtime.py').is_file()"
      - name: Run test suite
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build and validate Windows onedir distribution
        shell: pwsh
        run: .\build_windows.ps1 -SkipInstaller -NoInstallDependencies
      - name: Preserve CI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-report-${{ github.run_id }}
          path: |
            test-results.xml
            production-audit.json
          if-no-files-found: warn
          retention-days: 30
