name: Verify and release Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable version tag to verify or publish
        required: false
        type: string
      publish_release:
        description: Publish the verified release publicly (requires selecting the intended immutable version tag)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out exact tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up 64-bit Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install runtime, build, and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt -r requirements-dev.txt

      - name: Audit production dependency vulnerabilities
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit --cache-dir .audit-cache --timeout 60 -r requirements.txt --format json --output production-audit.json

      - name: Verify immutable version tag and source commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) { $env:RELEASE_TAG_INPUT } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Release verification must run from an immutable vMAJOR.MINOR.PATCH tag."
          }
          $tagCommit = (git rev-list -n 1 $releaseTag).Trim()
          $checkedOut = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $checkedOut) { throw "Checkout $checkedOut differs from tag commit $tagCommit." }
          $version = python tools/windows_build_check.py
          if ($LASTEXITCODE -ne 0) { throw "Windows build preflight failed." }
          if ($releaseTag -ne "v$version") { throw "Tag $releaseTag does not match project version v$version." }
          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag"
          try {
            $null = Invoke-RestMethod -Uri $releaseApi -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } -TimeoutSec 20 -ErrorAction Stop
            throw "Release $releaseTag already exists; published releases are immutable."
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOURCE_COMMIT=$checkedOut" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete application tests
        id: application_tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Build Windows x64 application and installer
        id: windows_build
        shell: pwsh
        run: |
          $transcript = Join-Path $env:RUNNER_TEMP "windows-build-transcript.txt"
          Start-Transcript -Path $transcript -Force
          try { .\build_windows.ps1 -PythonExe (Get-Command python.exe -ErrorAction Stop).Source -NoInstallDependencies }
          finally {
            Stop-Transcript
            New-Item -ItemType Directory -Path "dist\installer" -Force | Out-Null
            if (Test-Path -LiteralPath $transcript) { Copy-Item -LiteralPath $transcript -Destination "dist\installer\windows-build-transcript.txt" -Force }
          }

      - name: Build a representative 1.0.1 upgrade fixture
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          $bundle = (Resolve-Path "dist\ResearchAnalysis").Path
          $fixtureDir = Join-Path $env:RUNNER_TEMP "representative-upgrade-fixture"
          New-Item -ItemType Directory -Path $fixtureDir -Force | Out-Null
          & $iscc "/DAppVersion=1.0.1" "/DAppDistDir=$bundle" "/DAppOutputDir=$fixtureDir" "installer\ResearchAnalysis.iss"
          if ($LASTEXITCODE -ne 0) { throw "Representative fixture compilation failed." }
          $fixture = Join-Path $fixtureDir "ResearchAnalysis_Setup.exe"
          $fixtureVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($fixture).ProductVersion
          if (-not $fixtureVersion.StartsWith("1.0.1")) { throw "Fixture metadata is not 1.0.1: $fixtureVersion" }
          "UPGRADE_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Smoke test current-user install, missing LOCALAPPDATA, upgrade, settings, uninstall, and reinstall
        id: user_install_smoke
        shell: pwsh
        run: .\installer\test_installer.ps1 -InstallerPath .\dist\installer\ResearchAnalysis_Setup.exe -CurrentUser -SimulateMissingLocalAppData -UseDefaultInstallDirectory -PreviousInstallerPath $env:UPGRADE_FIXTURE -ReinstallAfterUninstall -ReportDirectory .\dist\installer\user-install

      - name: Smoke test elevated machine-wide installation
        id: machine_install_smoke
        shell: pwsh
        run: .\installer\test_installer.ps1 -InstallerPath .\dist\installer\ResearchAnalysis_Setup.exe -UseDefaultInstallDirectory -ReportDirectory .\dist\installer\machine-install

      - name: Sign installer when certificate is configured
        id: signing
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SIGNING_REQUIRED: ${{ vars.WINDOWS_SIGNING_REQUIRED }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          $required = $env:SIGNING_REQUIRED -eq "true"
          if ($hasCertificate -ne $hasPassword) { throw "Both signing certificate and password secrets must be configured together." }
          if (-not $hasCertificate) {
            if ($required) { throw "Signing is required, but signing secrets are unavailable." }
            "SIGNING_STATUS=UNSIGNED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No Authenticode certificate configured; installer will be explicitly unsigned."
            exit 0
          }
          $signtool = Get-Command signtool.exe -ErrorAction Stop
          $certificate = Join-Path $env:RUNNER_TEMP "release-signing-certificate.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $installer = (Resolve-Path "dist\installer\ResearchAnalysis_Setup.exe").Path
            & $signtool.Source sign /fd SHA256 /tr "https://timestamp.digicert.com" /td SHA256 /f $certificate /p $env:SIGNING_CERTIFICATE_PASSWORD $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed." }
            & $signtool.Source verify /pa /all /v $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
            "SIGNING_STATUS=SIGNED" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -LiteralPath $certificate -Force -ErrorAction SilentlyContinue
            Remove-Item Env:\SIGNING_CERTIFICATE_BASE64 -ErrorAction SilentlyContinue
            Remove-Item Env:\SIGNING_CERTIFICATE_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Verify release artifacts and create manifest and CycloneDX SBOM
        shell: pwsh
        run: |
          $installer = Join-Path $env:GITHUB_WORKSPACE "dist\installer\ResearchAnalysis_Setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Final installer missing: $installer" }
          if ((Get-Item -LiteralPath $installer).Length -lt 1MB) { throw "Installer is unexpectedly small." }
          $validation = python tools/validate_installer.py $installer
          if ($LASTEXITCODE -ne 0) { throw "Final installer metadata/format validation failed." }
          $productVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($installer).ProductVersion
          if (-not $productVersion.StartsWith($env:APP_VERSION)) { throw "Installer ProductVersion '$productVersion' does not match $env:APP_VERSION." }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist\installer\ResearchAnalysis_Setup.zip"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          $zip = [System.IO.Compression.ZipFile]::Open($archive, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $zip, $installer, "ResearchAnalysis_Setup.exe", [System.IO.Compression.CompressionLevel]::Optimal
            ) | Out-Null
          } finally { $zip.Dispose() }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entry = $zip.GetEntry("ResearchAnalysis_Setup.exe")
            if (-not $entry -or $entry.Length -ne (Get-Item -LiteralPath $installer).Length) { throw "Installer ZIP does not contain the complete expected executable." }
            $entryStream = $entry.Open()
            $zipHasher = [System.Security.Cryptography.SHA256]::Create()
            try { $archivedInstallerHash = [BitConverter]::ToString($zipHasher.ComputeHash($entryStream)).Replace("-", "").ToLowerInvariant() }
            finally { $entryStream.Dispose(); $zipHasher.Dispose() }
          } finally { $zip.Dispose() }
          if ($archivedInstallerHash -ne $hash) { throw "Installer ZIP contents do not match the verified installer." }
          @("$hash  ResearchAnalysis_Setup.exe", "$archiveHash  ResearchAnalysis_Setup.zip") | Set-Content -LiteralPath "dist\installer\SHA256SUMS.txt" -Encoding ascii
          python -m pip install cyclonedx-bom==8.0.1
          $sbomVenv = Join-Path $env:RUNNER_TEMP "production-sbom-environment"
          python -m venv $sbomVenv
          $sbomPython = Join-Path $sbomVenv "Scripts\python.exe"
          & $sbomPython -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve the isolated production dependency environment." }
          cyclonedx-py environment $sbomPython --pyproject pyproject.toml --output-format JSON --output-file "dist\installer\SBOM.cyclonedx.json"
          if ($LASTEXITCODE -ne 0) { throw "CycloneDX generation from the production-only environment failed." }
          $sbom = Get-Content "dist\installer\SBOM.cyclonedx.json" -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne "CycloneDX" -or -not $sbom.components) { throw "Generated production SBOM is empty or invalid." }
          $notes = @("# Research Analysis System v$env:APP_VERSION", "", "Download ``ResearchAnalysis_Setup.zip``, extract it, then run ``ResearchAnalysis_Setup.exe``.", "", "Authenticode signing status: **$env:SIGNING_STATUS**.", "", "SHA-256 checksums for the installer and ZIP archive are in ``SHA256SUMS.txt``.", "", "The release passed the tagged Windows build, automated test suite, packaged runtime check, user-scope install and representative upgrade fixture, and elevated machine-wide install smoke tests.", "", "The 1.0.1 installer used for the upgrade exercise is a representative fixture compiled from the 1.0.2 payload; it is not a historical release.", "", "A clean Windows 11 virtual-machine test and a real operating-system restart were not performed by this workflow.")
          $notes | Set-Content -LiteralPath "dist\installer\RELEASE_NOTES.md" -Encoding utf8

      - name: Write explicit Windows test report
        if: always()
        shell: pwsh
        run: |
          $status = { param($outcome) if ($outcome -eq 'success') { 'PASS' } elseif ($outcome -eq 'failure') { 'FAIL' } else { 'NOT TESTED' } }
          $user = & $status '${{ steps.user_install_smoke.outcome }}'
          $machine = & $status '${{ steps.machine_install_smoke.outcome }}'
          $tests = & $status '${{ steps.application_tests.outcome }}'
          $build = & $status '${{ steps.windows_build.outcome }}'
          New-Item -ItemType Directory -Path "dist\installer" -Force | Out-Null
          @("# Windows release test report", "", "- Tag: $env:RELEASE_TAG", "- Tested commit: $env:SOURCE_COMMIT", "- GitHub-hosted Windows x64: PASS", "- Python 3.13 test suite: $tests (test-results.xml)", "- PyInstaller onedir and installer build: $build (windows-build-transcript.txt)", "- Non-admin current-user install with LOCALAPPDATA absent, settings, DB, fixture upgrade, uninstall and reinstall: $user", "- Elevated machine-wide install, launch, shortcuts, uninstall and APPDATA preservation: $machine", "- Clean Windows 11 VM: NOT TESTED", "- Real OS restart: NOT TESTED", "- Authenticode status: $env:SIGNING_STATUS", "") | Set-Content -LiteralPath "dist\installer\WINDOWS_SMOKE_TEST_REPORT.md" -Encoding utf8

      - name: Retain build outputs and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ inputs.release_tag || github.ref_name }}
          path: |
            dist/installer/
            build/research_analysis/warn-research_analysis.txt
            test-results.xml
            production-audit.json
          if-no-files-found: warn
          retention-days: 90

  publish:
    name: Publish verified GitHub release
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact tag and validate it exists
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Verify tagged commit and release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $releaseTag = if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:RELEASE_TAG_INPUT) { $env:RELEASE_TAG_INPUT } else { $env:GITHUB_REF_NAME }
          if ($releaseTag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Publication requires an immutable version tag." }
          $tagCommit = (git rev-list -n 1 $releaseTag).Trim()
          if ($tagCommit -ne (git rev-parse HEAD).Trim()) { throw "Publication checkout does not match the tagged commit." }
          $releaseApi = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$releaseTag"
          try {
            $null = Invoke-RestMethod -Uri $releaseApi -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } -TimeoutSec 20 -ErrorAction Stop
            throw "Release $releaseTag already exists and cannot be overwritten."
          } catch {
            if (-not $_.Exception.Response -or [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download verified build artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: windows-release-${{ inputs.release_tag || github.ref_name }}
          path: dist/installer

      - name: Reverify installer checksum and release manifest
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist\installer\ResearchAnalysis_Setup.exe").Path
          $archive = (Resolve-Path "dist\installer\ResearchAnalysis_Setup.zip").Path
          $manifest = Get-Content "dist\installer\SHA256SUMS.txt" -Raw
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest -notmatch "(?m)^$actual\s+ResearchAnalysis_Setup\.exe$") { throw "Artifact checksum verification failed." }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($manifest -notmatch "(?m)^$archiveHash\s+ResearchAnalysis_Setup\.zip$") { throw "Installer ZIP checksum verification failed." }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $entry = $zip.GetEntry("ResearchAnalysis_Setup.exe")
            if (-not $entry -or $entry.Length -ne (Get-Item -LiteralPath $installer).Length) { throw "Installer ZIP is missing the expected executable." }
            $entryStream = $entry.Open()
            $zipHasher = [System.Security.Cryptography.SHA256]::Create()
            try { $archivedInstallerHash = [BitConverter]::ToString($zipHasher.ComputeHash($entryStream)).Replace("-", "").ToLowerInvariant() }
            finally { $entryStream.Dispose(); $zipHasher.Dispose() }
          } finally { $zip.Dispose() }
          if ($archivedInstallerHash -ne $actual) { throw "ZIP contents do not match the verified installer." }
          if (-not (Test-Path "dist\installer\SBOM.cyclonedx.json") -or -not (Test-Path "dist\installer\RELEASE_NOTES.md") -or -not (Test-Path "dist\installer\WINDOWS_SMOKE_TEST_REPORT.md")) { throw "A required release artifact is missing." }

      - name: Publish immutable verified GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = Get-Content "dist\installer\RELEASE_NOTES.md" -Raw
          gh release create $env:RELEASE_TAG `
            dist\installer\ResearchAnalysis_Setup.exe `
            dist\installer\ResearchAnalysis_Setup.zip `
            dist\installer\SHA256SUMS.txt `
            dist\installer\SBOM.cyclonedx.json `
            dist\installer\WINDOWS_SMOKE_TEST_REPORT.md `
            --verify-tag `
            --title "Research Analysis System $env:RELEASE_TAG" `
            --notes $notes
