services:
  - type: web
    name: research-analysis-downloads
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT --no-server-header --proxy-headers
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: RESEARCH_ANALYSIS_ENABLE_HSTS
        value: "true"
